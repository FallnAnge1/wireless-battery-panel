name: Windows build

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a new source version after a successful build
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build and run hardware-independent self-tests
        shell: pwsh
        run: .\scripts\build.ps1 -Test
      - name: Upload standalone Windows executable
        uses: actions/upload-artifact@v7
        with:
          name: WirelessBatteryPanel-win-x64
          path: dist/WirelessBatteryPanel.exe
          if-no-files-found: error
          retention-days: 30

  release:
    needs: build
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'Release v')) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish)
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate and publish standalone Windows package
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: .\scripts\publish-release.ps1
